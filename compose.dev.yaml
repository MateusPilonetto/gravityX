name: gravityx-dev

services:
  api:
    build:
      context: ./gravityX-api
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_API_PORT:-8001}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${DEV_API_PORT:-8001}"
      FRONTEND_URL: "http://localhost:${DEV_FRONTEND_PORT:-5173}"
      FRONTEND_URLS: "http://localhost:${DEV_FRONTEND_PORT:-5173},http://127.0.0.1:${DEV_FRONTEND_PORT:-5173}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/db/database.sqlite
      FILESYSTEM_DISK: local
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      PORT: "8000"
      L5_SWAGGER_GENERATE_ALWAYS: "true"
    volumes:
      - ./gravityX-api:/var/www
      - api_vendor:/var/www/vendor
      - api_sqlite_data:/var/db
      - api_storage_data:/var/www/storage
      - api_bootstrap_cache:/var/www/bootstrap/cache
      - api_app_state:/var/app-state
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./gravityX-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "http://localhost:${DEV_API_PORT:-8001}/api"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./gravityX-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_vendor:
  api_sqlite_data:
  api_storage_data:
  api_bootstrap_cache:
  api_app_state:
  frontend_node_modules:
